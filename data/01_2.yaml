# Вхідні дані: задача 1, набір 2 (Доставка їжі). Очікуваних результатів тут немає.
calls:
- function: classify_requirements
  args:
    requirements:
    - id: R1
      text: Клієнт оформлює замовлення та оплачує його карткою
    - id: R2
      text: Кур'єр бачить маршрут на мапі без затримки більше 3 секунд
    - id: R3
      text: Система переживає відмову одного сервера і швидко відновлюється
    - id: R4
      text: Пропускна здатність у піку обіду становить 200 замовлень за хвилину та масштабується горизонтально
    - id: R5
      text: Оплата проходить за стандартом PCI DSS
    - id: R6
      text: Запити від мобільного застосунку шифруються, а вхід потребує авторизації
    - id: R7
      text: Модульна будова дозволяє тестувати кур'єрський модуль окремо
    - id: R8
      text: Інтеграція з картковим еквайрингом через зовнішній протокол
    - id: R9
      text: Заборонено зберігати номер картки на сервері застосунку
    - id: R10
      text: Користувач закриває застосунок і повертається до замовлення
